[project]
name = "self-checkout-ml"
version = "0.1.0"
description = "ML snapshot storage API for self-checkout sessions"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.114.2",
    "httpx<1.0.0,>=0.28.0",
    "python-multipart<1.0.0,>=0.0.7",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "boto3>=1.35.0,<2.0.0",
    "PyJWT>=2.8.0,<3.0.0",
    "opencv-python-headless<5.0.0,>=4.10.0",
    "scikit-learn>=1.8,<2.0",
    "rq>=2.10,<3",
    "redis>=6,<7",
    "scikit-image>=0.25,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "ruff<1.0.0,>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
